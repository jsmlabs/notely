name: Bug report
description: Report a reproducible Notely issue
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open ... 2. Click ... 3. Observe ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Notely / Chrome version
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs (optional)
      description: Never paste notes, backups, passwords, or other personal data.
